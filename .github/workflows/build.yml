name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  LINGUA_RS_COMMIT: 74eed3045bec53ba4feda2ac1780283f76fa302e
  MODEL_SHA256: 35643167f93eeeeb40ccf40867256a907ea2694c91bd28a47d5d82c94d457211
  MACOS_MIN_VERSION: '11.0'

jobs:
  model:
    name: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject machine-specific absolute paths
        run: |
          if git grep -nP '(?<![A-Za-z])(?:[A-Za-z]:[\\/]|/(?:Users|home)/[^/]+/)'; then
            echo '::error::Use relative paths instead of machine-specific absolute paths.'
            exit 1
          fi

      - id: cache
        uses: actions/cache@v5
        with:
          path: data/model.bin
          key: model-v1-${{ env.LINGUA_RS_COMMIT }}-${{ hashFiles('src/model.cpp', 'tools/export.rs', 'tools/prepare.ps1', 'tools/reference.rs', 'tools/reference.lock', 'generated/metadata.hpp') }}

      - uses: actions/checkout@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: pemistahl/lingua-rs
          ref: ${{ env.LINGUA_RS_COMMIT }}
          path: upstream/lingua-rs

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Prepare the pinned Lingua exporter
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/prepare.ps1 -RustRoot ./upstream/lingua-rs

      - uses: Swatinem/rust-cache@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          workspaces: build/reference

      - name: Generate the compact all-language model
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path build/reference/Cargo.toml
          ./build/reference/target/release/lingua-reference export ./upstream/lingua-rs data

      - name: Verify generated metadata and model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git diff --exit-code -- generated/metadata.hpp
          cmake -S . -B build/model -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINGUA_BUILD_JNI=OFF
          cmake --build build/model
          build/model/lingua_tool compile data/ngrams.raw data/model.bin
          build/model/lingua_tool selftest data/model.bin

      - name: Verify the pinned model checksum
        run: echo "$MODEL_SHA256  data/model.bin" | sha256sum --check --strict

      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: data/model.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  native:
    name: ${{ matrix.platform }}
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
            library: lingua_jni.dll
          - runner: macos-latest
            platform: macos-aarch64
            library: liblingua_jni.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - uses: actions/download-artifact@v8
        with:
          name: model
          path: data

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          args=(-S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [ "${{ runner.os }}" = macOS ]; then
            args+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION")
          fi
          cmake "${args[@]}"
          cmake --build build/cmake
          ctest --test-dir build/cmake --output-on-failure
          if [ "${{ runner.os }}" = Windows ]; then
            pwsh ./tools/jni-smoke.ps1
          else
            bash ./tools/jni-smoke.sh
          fi

      - name: Check native portability
        shell: bash
        env:
          LIBRARY: build/cmake/${{ matrix.library }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos-aarch64)
              [ "$(lipo -archs "$LIBRARY")" = arm64 ]
              otool -l "$LIBRARY" | grep -A4 LC_BUILD_VERSION
              otool -l "$LIBRARY" | grep -q "minos $MACOS_MIN_VERSION"
              ;;
            windows-x86_64)
              dumpbin.exe /dependents "$LIBRARY" | tee dependencies.txt
              ! grep -Eqi 'VCRUNTIME|MSVCP|api-ms-win-crt' dependencies.txt
              ;;
          esac

      - name: Stage native library
        shell: bash
        run: |
          mkdir -p artifacts/native/${{ matrix.platform }}
          cp build/cmake/${{ matrix.library }} artifacts/native/${{ matrix.platform }}/

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/native
          retention-days: 1
          if-no-files-found: error

  linux:
    name: linux-x86_64
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: model
          path: data

      - name: Build and test in the release container
        run: docker build --target native-artifact --output type=local,dest=artifacts .

      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x86_64
          path: artifacts/native
          retention-days: 1
          if-no-files-found: error

  package:
    name: package
    needs: [model, native, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: jni/target/generated-resources/native

      - uses: actions/download-artifact@v8
        with:
          name: model
          path: jni/target/generated-resources/model

      - name: Show release inputs
        run: find jni/target/generated-resources -type f -printf '%12s  %p\n' | sort -k2

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -ntp -f jni/pom.xml versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Package universal and platform JARs
        run: mvn -B -ntp -f jni/pom.xml -Pdist -DskipTests package

      - name: Collect exactly four runtime JARs
        run: |
          set -euo pipefail
          mkdir dist
          find jni/target -maxdepth 1 -type f -name 'lingua-cpp-jni-*.jar' \
            -exec cp {} dist/ \;
          [ "$(find dist -maxdepth 1 -name '*.jar' | wc -l)" -eq 4 ]
          for jar in dist/*.jar; do
            [ "$(wc -c < "$jar")" -lt 200000000 ] \
              || { echo "::error::$jar exceeds the 200 MB release limit"; exit 1; }
            unexpected="$(unzip -Z1 "$jar" | grep -Ev \
              '(/$|^META-INF/(MANIFEST\.MF|LICENSE|NOTICE)$|^io/github/onedash/linguacpp/.*\.class$|^model/model\.bin(\.sha256)?$|^native/(windows-x86_64/lingua_jni\.dll|linux-x86_64/liblingua_jni\.so|macos-aarch64/liblingua_jni\.dylib)(\.sha256)?$)' || true)"
            [ -z "$unexpected" ] \
              || { echo "::error::$jar contains unexpected files: $unexpected"; exit 1; }
          done
          ls -lh dist
          for jar in dist/*.jar; do
            echo "== $(basename "$jar")"
            unzip -l "$jar" | grep -E 'native/.*(dll|so|dylib)$|model/model.bin$'
          done

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -ntp -f jni/pom.xml -Pdist -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: jars
          path: dist/*.jar
          retention-days: 1

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
